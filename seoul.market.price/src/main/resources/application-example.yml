spring:
  servlet:
    multipart:
      # 첨부파일 하나의 최대 크기.
      max-file-size: 10MB
      # 파일 최대 5개와 multipart 부가 데이터를 포함한 요청 전체 제한.
      max-request-size: 32MB

# MinIO 접속 정보는 운영 환경에서 환경변수로 주입한다.
minio:
  endpoint: ${MINIO_ENDPOINT:http://192.168.0.4:9000}
  # 두 키가 모두 비어 있으면 익명 접근을 시도하며 Private 버킷에서는 사용할 수 없다.
  access-key: ${MINIO_ACCESS_KEY:}
  secret-key: ${MINIO_SECRET_KEY:}
  bucket: ${MINIO_BUCKET:seoul-market-attachments}

app:
  # 일반 게시판과 Q&A가 공통으로 사용하는 첨부 정책이다.
  attachment:
    max-file-count: 5
    # 파일당 10MB를 바이트 단위로 표현한다.
    max-file-size: 10485760
    # 게시글당 전체 첨부 용량 30MB를 바이트 단위로 표현한다.
    max-total-size: 31457280
